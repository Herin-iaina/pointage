# Configuration Ofelia - Planification des tâches
# Format : INI

[scheduler]
# Mode de connexion à Docker
docker-host = unix:///var/run/docker.sock

# Job : Extraction ZK → MongoDB
# Exécution : Toutes les heures à la minute 0 (0 * * * *)
[job "extraction-hourly"]
schedule = 0 * * * *
container = pointage-extraction
command = python3 -m src.main
on-error = continue
on-error-fatal = false

# Autres exemples de planification (décommenter pour utiliser) :

# Exécution toutes les 30 minutes
# [job "extraction-every-30min"]
# schedule = */30 * * * *
# container = pointage-extraction
# command = python3 -m src.main
# on-error = continue

# Exécution à 7h du matin chaque jour
# [job "extraction-daily-7am"]
# schedule = 0 7 * * *
# container = pointage-extraction
# command = python3 -m src.main
# on-error = continue

# Exécution à 7h et 14h chaque jour
# [job "extraction-twice-daily"]
# schedule = 0 7,14 * * *
# container = pointage-extraction
# command = python3 -m src.main
# on-error = continue

# Exécution toutes les heures entre 9h et 17h
# [job "extraction-business-hours"]
# schedule = 0 9-17 * * *
# container = pointage-extraction
# command = python3 -m src.main
# on-error = continue
