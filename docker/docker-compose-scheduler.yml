services:
  # Service Python - Extraction ZK → MongoDB
  extraction:
    build:
      context: ..
      dockerfile: Dockerfile
    # container_name: pointage-extraction # Incompatible avec replicas
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == manager
    cap_add:
      - NET_RAW
    environment:
      MONGODB_URI: mongodb://172.17.17.72:27017/pointage
    volumes:
      - ../output:/app/output
      - ../config:/app/config
      - ../logs:/app/logs
    restart: unless-stopped
    labels:
      # Configuration Ofelia via labels (méthode officielle)
      ofelia: "enabled"
      ofelia.enabled: "true"
      ofelia.job-exec.extraction-hourly.schedule: "@hourly"
      ofelia.job-exec.extraction-hourly.command: "python3 -m src.main"
    network_mode: "host"

  # Scheduler Ofelia
  scheduler:
    image: mcuadros/ofelia:latest
    container_name: pointage-scheduler
    depends_on:
      - extraction
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: daemon --docker
    restart: unless-stopped
    # Scheduler doesn't need host net, but needs to reach docker daemon (via socket)
