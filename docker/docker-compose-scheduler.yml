services:
  # Service Python - Extraction ZK → MongoDB
  extraction:
    build:
      context: /opt/pointage
      dockerfile: Dockerfile
    container_name: pointage-extraction
    network_mode: host
    environment:
      MONGODB_URI: mongodb://172.17.17.72:27017/pointage
    volumes:
      - /opt/pointage/output:/app/output
      - /opt/pointage/config:/app/config
      - /opt/pointage/logs:/app/logs
    restart: unless-stopped
    labels:
      # Configuration Ofelia via labels (méthode officielle)
      ofelia: "enabled"
      ofelia.enabled: "true"
      ofelia.job-exec.extraction-hourly.schedule: "@hourly"
      ofelia.job-exec.extraction-hourly.command: "python3 -m src.main"

  # Scheduler Ofelia
  scheduler:
    image: mcuadros/ofelia:latest
    container_name: pointage-scheduler
    depends_on:
      - extraction
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: daemon --docker
    restart: unless-stopped
