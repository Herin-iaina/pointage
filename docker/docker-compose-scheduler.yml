version: '3.8'

services:
  # Service Python - Extraction ZK → MongoDB
  extraction:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: pointage-extraction
    hostname: pointage-extraction
    environment:
      MONGODB_URI: mongodb://172.17.17.72:27017/pointage
    volumes:
      # Chemins absolus pour Linux (ajuste selon ton déploiement)
      - /opt/pointage/output:/app/output
      - /opt/pointage/config:/app/config
      - /opt/pointage/logs:/app/logs
    restart: "no"
    # Label pour le scheduler Ofelia
    labels:
      ofelia: "enabled"

  # Scheduler Ofelia - Exécute le pipeline selon un horaire
  scheduler:
    image: mcuadros/ofelia:latest
    container_name: pointage-scheduler
    hostname: pointage-scheduler
    depends_on:
      - extraction
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: daemon --docker
    restart: unless-stopped
    environment:
      # Exécute le service extraction toutes les heures (à :00)
      OFELIA_JOB_EXEC_EXTRACTION_SCHEDULE: "0 * * * *"
      OFELIA_JOB_EXEC_EXTRACTION_CONTAINER: "pointage-extraction"
      OFELIA_JOB_EXEC_EXTRACTION_COMMAND: "python3 -m src.main"

      # Options alternatives de planification :
      # "@every 30m"    → Toutes les 30 minutes
      # "@hourly"       → Toutes les heures
      # "0 7 * * *"     → 7h du matin chaque jour
      # "0 9-17 * * *"  → Toutes les heures entre 9h et 17h
