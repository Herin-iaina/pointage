version: '3.8'

services:
  # Service Python - Extraction ZK → MongoDB
  extraction:
    build: .
    container_name: pointage-extraction
    environment:
      # MongoDB est sur le serveur (pas en conteneur)
      MONGODB_URI: mongodb://172.17.17.72:27017/pointage
    volumes:
      - ./output:/app/output
      - ./config:/app/config
    # Pas de network spécifique - utilise le network par défaut
    # Le conteneur peut accéder aux services externes via l'IP du serveur
    # Redémarrage automatique après exécution
    restart: "no"
